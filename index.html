<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arvika Fashion | Premium Indian Craftsmanship for Modern European Fashion</title>
    <meta name="description" content="Arvika Fashion brings timeless European luxury, Scandinavian minimalism, and ethical Indian garment craftsmanship together. Discover organic linen, pure cotton, and tailored couture." />
    <meta name="theme-color" content="#214C3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- OWASP Security & Clean Google Translate Styling -->
    <style>
      .goog-te-banner-frame { display: none !important; }
      body { top: 0px !important; }
      .goog-te-gadget { display: none !important; }
      #google_translate_element { display: none !important; }
      .skiptranslate { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
      #goog-gt-tt { display: none !important; visibility: hidden !important; }
    </style>
  </head>
  <body class="bg-[#FAF8F4] text-[#1C1C1C] antialiased selection:bg-[#D8C6A5] selection:text-[#214C3A]">
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,de,fr,es,it',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
